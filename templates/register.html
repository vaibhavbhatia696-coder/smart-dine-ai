
{% extends "base.html" %}

{% block title %}Register Restaurant | SmartDine AI{% endblock %}

{% block content %}

<style>
.auth-section {
    min-height: 75vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 55px 20px;
}

.auth-card {
    width: 100%;
    max-width: 480px;
    background: #fff;
    padding: 38px;
    border-radius: 22px;
    box-shadow: 0 15px 50px rgba(0,0,0,.09);
}

.auth-card h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

.auth-card p {
    color: #777;
    margin-bottom: 25px;
}

.auth-card label {
    display: block;
    margin: 15px 0 7px;
    font-weight: 600;
}

.auth-card input {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
}

.auth-card input:focus {
    border-color: #ef7545;
}

.auth-card button {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 14px;
    margin-top: 24px;
    background: #ef7545;
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

.auth-card button:hover {
    background: #d85b30;
}

.auth-bottom {
    text-align: center;
    margin-top: 22px;
}

.auth-bottom a {
    color: #e96e40;
    font-weight: 700;
    text-decoration: none;
}
</style>

<section class="auth-section">
    <div class="auth-card">

        <h1>Create Restaurant Account</h1>
        <p>Register your restaurant and start managing orders with SmartDine AI.</p>

        <form method="POST" action="{{ url_for('register') }}">

            <label>Restaurant Name</label>
            <input
                type="text"
                name="restaurant_name"
                placeholder="Enter restaurant name"
                required
            >

            <label>Owner Name</label>
            <input
                type="text"
                name="owner_name"
                placeholder="Enter your name"
                required
            >

            <label>Email Address</label>
            <input
                type="email"
                name="email"
                placeholder="Enter email address"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Minimum 6 characters"
                minlength="6"
                required
            >

            <button type="submit">Create Account</button>

        </form>

        <div class="auth-bottom">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </div>

    </div>
</section>

{% endblock %}
